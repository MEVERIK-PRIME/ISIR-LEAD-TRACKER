[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "isir-lead-tracker-worker"
version = "0.1.0"
description = "Python ingestion and document worker for ISIR lead tracking."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0,<0.29.0",
    "pypdf>=5.7.0,<6.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "redis>=5.0.0,<6.0.0",
    "tenacity>=9.1.0,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[project.scripts]
isir-worker = "isir_lead_tracker_worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
